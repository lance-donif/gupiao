[project]
name = "echo-assistant"
version = "0.1.0"
description = "回声 · Web 与 QQ 个人 AI 工作台"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "python-dotenv==1.2.4",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
browser = [
    "playwright==1.62.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 110
